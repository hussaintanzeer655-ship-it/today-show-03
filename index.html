<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Today Show Grid</title><style>:root{--bg:#f6f7fb;--fg:#111827;--card:#fff;--accent:#0ea5e9;--shadow:0 6px 16px rgba(0,0,0,.08)}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);font-family:Arial, sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;padding:14px 18px;align-items:center} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:16px} .tile{background:var(--card);border-radius:12px;padding:14px;border:1px solid #eee;box-shadow:var(--shadow)} .tile h3{margin:0 0 6px} .tile p{margin:0;color:#555} .chip{font-size:12px;background:#e2e8f0;border-radius:999px;padding:4px 8px} @media (max-width:600px){.grid{grid-template-columns:1fr}} </style></head><body><header><div>Today Show</div><div class="row"><span class="chip">Live</span></div></header><section class="grid" id="grid"></section><div class="footer" style="text-align:center;padding:12px 0;color:#666">© Today Show Grid</div><script>const items=[{t:'News',d:'Latest updates'},{t:'Weather',d:'Local forecast'},{t:'Sports',d:'Scores'}];const g=document.getElementById('grid');items.forEach(i=>{g.insertAdjacentHTML('beforeend','<div class=\"tile\"><h3>'+i.t+'</h3><p>'+i.d+'</p></div>')});</script></body></html>
